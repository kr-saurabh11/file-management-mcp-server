[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-management-mcp-server"
version = "0.1.0"
description = "FastMCP File Management Server providing standard file operations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.4",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
file-management-mcp-server = "file_manager.server:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/file_manager"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
